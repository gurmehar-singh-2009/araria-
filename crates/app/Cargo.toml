[package]
name = "araria"
description = "Araria — an account-free, browser-first 3D game platform and creation studio."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
araria-core = { workspace = true }
araria-runtime = { workspace = true }
araria-engine = { workspace = true }
araria-storage = { workspace = true }
araria-platform = { workspace = true }
bevy = { workspace = true }
bevy_egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement"] }
