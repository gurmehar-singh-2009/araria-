[package]
name = "araria-storage"
description = "Araria's local-first persistence: one small file store backed by the filesystem natively and IndexedDB in the browser."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbCursorWithValue",
    "IdbCursor",
    "Event",
    "DomException",
] }
